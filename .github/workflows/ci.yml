name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, deploy]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck · Lint · Test · Build · Exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck playground
        run: npm run typecheck:playground
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check package exports (publint + attw)
        run: npm run check:exports
      - name: Build playground
        run: npm run playground:build
      - name: Pack tarball for integration tests
        run: node scripts/pack-local.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: examples/irt-ui-local.tgz

  integration:
    name: Integration (${{ matrix.example }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [react, nextjs]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: examples
      - name: Install example (from packed tarball)
        working-directory: examples/${{ matrix.example }}
        run: npm install --no-audit --no-fund
      - name: Typecheck example
        working-directory: examples/${{ matrix.example }}
        run: npm run typecheck
      - name: Build example
        working-directory: examples/${{ matrix.example }}
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
